# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

[include ../base.cfg]

[heater_bed]
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: Generic 3950
min_temp: 0
max_temp: 130

[fan]
pin: fan_part_cooling_pin
shutdown_speed: 1.0

[heater_fan toolhead_cooling_fan]
pin: fan_toolhead_cooling_pin
fan_speed: 1
heater: extruder
heater_temp: 50.0

[controller_fan controller_fan]
pin: fan_controller_board_pin
idle_speed: 0.7

[printer]
kinematics: cartesian

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 15,15
mesh_max: 105,105
probe_count: 5,5
fade_start: 1.0
fade_end: 10.0
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: .2

[screws_tilt_adjust]
screw1: 34, 14
screw1_name: Front Screw
screw2: -16, 125
screw2_name: Rear Left Screw
screw3: 89, 125
screw3_name: Rear Right Screw
horizontal_move_z: 10
speed: 200
screw_thread: CCW-M3

[stepper_x]
position_endstop: -17
position_min: -17
position_max: 120

[stepper_y]
position_endstop: -5
position_min: -5
position_max: 125

[stepper_z]
position_min: -5
position_max: 120
